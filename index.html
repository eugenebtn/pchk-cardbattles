<body>
<script>/* the studio title screen from the very first frame (otherwise the old one flashes while the scripts load) */ if (!/[?&]intro=off/.test(location.search)) document.body.classList.add('studio');</script>
<div id="app">
  <!-- Animated background shared by the splash, menu and hero select -->
  <div id="scene" class="scene">
    <div class="scene-velvet"></div>
    <div class="scene-slices" id="scene-slices"></div>
    <div class="scene-shade"></div>
    <canvas id="menu-bg"></canvas>
  </div>

  <!-- Splash -->
  <section id="splash" class="screen active">
    <!-- studio opening (body.studio): the dark hall, spotlights switching on over the stage -->
    <div class="st-hall"></div><div class="st-spots"><i></i><i></i><i></i><i></i></div>
    <div class="fan-sub">Подземелья Чикен Карри</div>
    <div class="fan-wrap"><div class="fan" data-fan></div></div>
    <h1 class="fan-logo-img"><img src="assets/ui/logo.webp" alt="Карточные битвы"></h1>
    <div class="press">Нажмите, чтобы начать</div>
    <div class="splash-legal">Неофициальный некоммерческий фан-проект для игры с друзьями</div>
  </section>

  <!-- Menu: big Leader art on the right, gold plaques on the left, profile bar on top -->
  <section id="menu" class="screen mv">
    <div class="mv-art"></div>
    <header class="mv-top">
      <button class="mv-me" data-act="stats" data-tip="Профиль|Ваше имя, награды и статистика">
        <i class="mv-ava"></i><span><b class="mv-name">Игрок</b><small class="mv-sub">Профиль</small></span>
      </button>
      <div class="mv-chip" data-tip="Победы|Сколько партий вы выиграли"><img src="assets/icons/laurel-crown.svg" alt=""><b id="mv-wins">0</b></div>
      <div class="mv-chip" data-tip="Награды|Сколько наград открыто"><img src="assets/icons/trophy.svg" alt=""><b id="mv-ach">0</b></div>
      <nav class="mv-icons">
        <button data-act="rules" data-tip="Правила|Как играть"><img src="assets/icons/open-book.svg" alt="Правила"></button>
        <button data-act="feedback" data-tip="Отзыв|Ошибка, идея или вопрос"><img src="assets/icons/chat-bubble.svg" alt="Отзыв"></button>
        <button class="snd-btn" data-snd data-tip="Звук|Выключить звук или изменить громкость"><img src="assets/icons/sound-on.svg" alt="Звук"></button>
        <button data-act="settings" data-tip="Настройки|Звук, имя, поле, таймер"><img src="assets/icons/cog.svg" alt="Настройки"></button>
      </nav>
    </header>
    <div class="mv-left">
      <img class="mv-logo" src="assets/ui/logo.webp" alt="Карточные битвы">
      <div class="mv-sub2">Подземелья Чикен Карри</div>
      <div id="join-banner" class="join-banner hidden"></div>
      <!-- Variant В3 (2026-10-26): a glass panel — the «Играть» tile on top, rows with live notes below -->
      <div class="mv-panel mv-btns">
        <button class="mvp-play" data-act="play"><b>Играть</b><span class="mvp-go">В бой ›</span><small class="plq-last" id="play-last"></small></button>
        <button class="mvp-row" data-act="decks"><span class="mvp-circ"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="12" height="16" rx="2"/><path d="M15 6l4 1-3 13-4-1"/></svg></span><span class="mvp-tx"><b>Колоды</b><small id="mv-decks-sub">стартовые и свои</small></span><i>›</i></button>
        <button class="mvp-row" data-act="friends"><span class="mvp-circ"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><circle cx="17" cy="7" r="2.5"/><path d="M17 13c2.8 0 5 1.8 5 4.5"/></svg></span><span class="mvp-tx"><b>Друзья</b><small id="mv-friends-sub">позвать в партию</small></span><i>›</i></button>
        <button class="mvp-row" data-act="ranking"><span class="mvp-circ"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg></span><span class="mvp-tx"><b>Рейтинг</b><small id="mv-side">лиги игроков</small></span><i>›</i></button>
      </div>
      <nav class="mv-more top-nav">
        <button data-act="tour" class="hidden">Турнир</button>
        <button data-act="shop" class="hidden">Магазин</button>
      </nav>
      <div class="mv-login" id="mv-login"></div>
    </div>
    <div class="menu-opts hidden" id="menu-opts">
      <div class="mo-head"><b>Настройки</b><button class="mo-close win-x" data-close-opts aria-label="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="k-sec">Звук</div>
      <label class="k-row"><span>Звук</span><input type="checkbox" class="k-tog" id="opt-sound" checked></label>
      <label class="k-row"><span>Музыка</span><input type="checkbox" class="k-tog" id="opt-music" checked></label>
      <div class="k-vols"><span class="k-sub">Громкость</span>
      <label class="k-row"><span>Музыка</span><input type="range" min="0" max="100" data-vol="music"></label>
      <label class="k-row"><span>Звуки игры</span><input type="range" min="0" max="100" data-vol="sfx"></label>
      <label class="k-row"><span>Кнопки</span><input type="range" min="0" max="100" data-vol="ui"></label>
      </div>
      <div class="k-sec">Партия</div>
      <div class="k-block"><label for="opt-autopass" class="k-blabel">Ответ в чужой ход<small>Когда спрашивать про карты с Опережением</small></label><select id="opt-autopass"><option value="smart">спрашивать, только когда целятся в мои карты</option><option value="always">спрашивать всегда</option><option value="never">не спрашивать</option></select></div>
      <label class="k-row"><span>Таймер хода с другом</span><select id="opt-timer"><option value="0">без таймера</option><option value="60">60 секунд</option><option value="90">90 секунд</option><option value="120">2 минуты</option></select></label>
      <label class="k-row"><span>Совет лучшего хода<small>Кнопка «Совет» на панели справа</small></span><input type="checkbox" class="k-tog" id="opt-coach"></label>
      <label class="k-row"><span>Поле</span><select id="opt-board"><option value="random">Случайное место</option><option value="160">Таверна «Кайф»</option><option value="8">Замок Вёрджинвальд</option><option value="33">Пороховой склад</option><option value="5">Кёнигпон</option><option value="125">Подземный тайник</option><option value="130">Рыночная площадь</option><option value="116">Замок Нассератт</option></select></label>
      <div class="k-sec">Профиль</div>
      <label class="k-row"><span>Ваше имя</span><input type="text" id="opt-name" maxlength="20" placeholder="Игрок"></label>
      <div class="mo-test"><b>Для проверки</b><label><input type="checkbox" id="opt-bonus"> Тест-правило: +1 💰 за каждую карту меньше 5 после муллигана</label></div>
    </div>
    <p class="credits"><span>Неофициальный фан-проект, не связан с «Чикен Карри»</span><button data-act="legal">Правовая информация и авторы</button><a class="buy-real" href="https://cardbattles.cc" target="_blank" rel="noopener">Купить настоящую игру ↗</a></p>
  </section>

  <!-- Hero select -->
  <section id="heroes" class="screen"></section>

  <!-- Deck picker / waiting room -->
  <section id="picker" class="screen">
    <div class="picker-box">
      <h2 id="picker-title">Выберите колоду</h2>
      <div id="picker-list" class="picker-list"></div>
      <div id="picker-online" class="picker-online hidden"></div>
      <div class="picker-actions">
        <button class="btn" data-act="back">← Назад</button>
        <button class="btn primary" id="picker-go" disabled>Начать</button>
      </div>
    </div>
  </section>

  <!-- Deck builder -->
  <section id="builder" class="screen"></section>

  <!-- Rules -->
  <section id="rules" class="screen"></section>

  <!-- Stats -->
  <section id="stats" class="screen"></section>

  <!-- Shop (draft, FEATURES.shop) -->
  <section id="shop" class="screen"></section>

  <!-- Legal -->
  <section id="legal" class="screen"></section>

  <!-- Game -->
  <section id="game" class="screen">
    <div id="stage">
      <div id="board"></div>
      <canvas id="fx-canvas" width="1600" height="900"></canvas>
      <div id="fx-layer"></div>
      <div id="ui-layer"></div>
    </div>
    <div id="preview" class="preview hidden"></div>
      </section>
</div>
