<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0604">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Карточные битвы ПЧК</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>⚔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&family=PT+Sans+Narrow:wght@400;700&family=Cormorant+SC:wght@500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700;800&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/ui2.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/builder.css">
<link rel="stylesheet" href="css/powers.css">
<link rel="stylesheet" href="css/premium.css">
<link rel="stylesheet" href="css/fan.css">
<link rel="stylesheet" href="css/cardskin.css">
</head>
<body>
<div id="app">
  <!-- Animated background shared by the splash, menu and hero select -->
  <div id="scene" class="scene">
    <div class="scene-velvet"></div>
    <div class="scene-slices" id="scene-slices"></div>
    <div class="scene-shade"></div>
    <canvas id="menu-bg"></canvas>
  </div>

  <!-- Splash -->
  <section id="splash" class="screen active">
    <div class="fan-sub">Подземелья Чикен Карри</div>
    <div class="fan-wrap"><div class="fan" data-fan></div></div>
    <h1 class="fan-logo">Карточные битвы</h1>
    <div class="press">Нажмите, чтобы начать</div>
    <div class="splash-legal">Неофициальный некоммерческий фан-проект для игры с друзьями</div>
  </section>

  <!-- Menu -->
  <section id="menu" class="screen">
    <div class="fan-sub">Подземелья Чикен Карри</div>
    <nav class="top-nav">
      <button data-act="tutorial">Обучение</button>
      <button data-act="hotseat">Вдвоём</button>
      <button data-act="ranking">Рейтинг</button>
      <button data-act="stats">Статистика</button>
      <button data-act="rules">Правила</button>
      <button data-act="settings">Настройки</button>
      <button data-act="feedback">Отзыв</button>
    </nav>
    <div id="join-banner" class="join-banner hidden"></div>
    <div class="fan-wrap"><div class="fan" data-fan></div></div>
    <h1 class="fan-logo">Карточные битвы</h1>
    <div class="menu-main">
      <button class="pill quiet" data-act="host">С другом</button>
      <button class="pill gold" data-act="bot">Играть</button>
      <button class="pill quiet" data-act="decks">Колоды</button>
    </div>
    <a class="buy-real" href="https://cardbattles.cc" target="_blank" rel="noopener"><span class="buy-ico"></span>Купить настоящую игру<small>cardbattles.cc — поддержите авторов</small></a>
    <div class="menu-opts hidden" id="menu-opts">
      <label><input type="checkbox" id="opt-sound" checked> Звук</label>
      <label><input type="checkbox" id="opt-music" checked> Музыка</label>
      <label><input type="checkbox" id="opt-bonus"> Тест-правило: +1 💰 за каждую карту меньше 5 после муллигана</label>
      <label><input type="checkbox" id="opt-autopass"> Не спрашивать об Опережении (авто-пас)</label>
      <label class="name-row">Ваше имя: <input type="text" id="opt-name" maxlength="20" placeholder="Игрок"></label>
      <label class="name-row">Поле: <select id="opt-board"><option value="random">Случайное место</option><option value="160">Таверна «Кайф»</option><option value="8">Замок Вёрджинвальд</option><option value="33">Пороховой склад</option><option value="5">Кёнигпон</option><option value="125">Подземный тайник</option><option value="130">Рыночная площадь</option><option value="116">Замок Нассератт</option></select></label>
    </div>
    <p class="credits"><span>Неофициальный фан-проект, не связан с «Чикен Карри»</span><button data-act="legal">Правовая информация и авторы</button></p>
  </section>

  <!-- Hero select -->
  <section id="heroes" class="screen"></section>

  <!-- Deck picker / waiting room -->
  <section id="picker" class="screen">
    <div class="picker-box">
      <h2 id="picker-title">Выберите колоду</h2>
      <div id="picker-list" class="picker-list"></div>
      <div id="picker-online" class="picker-online hidden"></div>
      <div class="picker-actions">
        <button class="btn" data-act="back">← Назад</button>
        <button class="btn primary" id="picker-go" disabled>Начать</button>
      </div>
    </div>
  </section>

  <!-- Deck builder -->
  <section id="builder" class="screen"></section>

  <!-- Rules -->
  <section id="rules" class="screen"></section>

  <!-- Stats -->
  <section id="stats" class="screen"></section>

  <!-- Legal -->
  <section id="legal" class="screen"></section>

  <!-- Game -->
  <section id="game" class="screen">
    <div id="stage">
      <div id="board"></div>
      <canvas id="fx-canvas" width="1600" height="900"></canvas>
      <div id="fx-layer"></div>
      <div id="ui-layer"></div>
    </div>
    <div id="preview" class="preview hidden"></div>
      </section>
</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
<script src="vendor/peerjs.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
