<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карточные битвы ПЧК</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>⚔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&family=PT+Sans+Narrow:wght@400;700&family=Cormorant+SC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/ui2.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/builder.css">
</head>
<body>
<div id="app">
  <!-- Animated background shared by the splash, menu and hero select -->
  <div id="scene" class="scene">
    <div class="scene-art"><div class="scene-strip" id="scene-strip"></div></div>
    <div class="scene-fog f1"></div><div class="scene-fog f2"></div>
    <canvas id="menu-bg"></canvas>
    <div class="scene-vignette"></div>
  </div>

  <!-- Splash -->
  <section id="splash" class="screen active">
    <div class="splash-box">
      <div class="crest"><span>⚔</span></div>
      <h1 class="logo big-logo"><span>Карточные</span><span>битвы</span><small>Подземелья Чикен Карри</small></h1>
      <div class="press">Нажмите, чтобы начать</div>
    </div>
  </section>

  <!-- Menu -->
  <section id="menu" class="screen">
    <div class="menu-box">
      <h1 class="logo"><span>Карточные</span><span>битвы</span><small>Подземелья Чикен Карри</small></h1>
      <div id="join-banner" class="join-banner hidden"></div>
      <div class="menu-buttons">
        <button class="plaque main" data-act="bot"><span class="pl-ico">⚔️</span><span class="pl-txt">Играть с компьютером<small>Тренировка против бота</small></span></button>
        <button class="plaque main" data-act="host"><span class="pl-ico">🌐</span><span class="pl-txt">Играть с другом<small>Отправьте ссылку — и в бой</small></span></button>
        <div class="plaque-row two">
          <button class="plaque" data-act="tutorial"><span class="pl-ico">🎓</span><span class="pl-txt">Обучение<small>7 шагов и учебная партия</small></span></button>
          <button class="plaque" data-act="hotseat"><span class="pl-ico">🪑</span><span class="pl-txt">Вдвоём за экраном<small>Передавайте устройство</small></span></button>
        </div>
        <div class="plaque-row">
          <button class="plaque small" data-act="decks"><span class="pl-ico">📜</span><span class="pl-txt">Колоды</span></button>
          <button class="plaque small" data-act="stats"><span class="pl-ico">📊</span><span class="pl-txt">Статистика</span></button>
          <button class="plaque small" data-act="rules"><span class="pl-ico">📖</span><span class="pl-txt">Правила</span></button>
          <button class="plaque small" data-act="settings"><span class="pl-ico">⚙️</span><span class="pl-txt">Настройки</span></button>
        </div>
      </div>
      <div class="menu-opts hidden" id="menu-opts">
        <label><input type="checkbox" id="opt-sound" checked> Звук</label>
        <label><input type="checkbox" id="opt-music" checked> Музыка</label>
        <label><input type="checkbox" id="opt-bonus"> Тест-правило: +1 💰 за каждую карту меньше 5 после муллигана</label>
        <label><input type="checkbox" id="opt-autopass"> Не спрашивать об Опережении (авто-пас)</label>
        <label class="name-row">Ваше имя: <input type="text" id="opt-name" maxlength="20" placeholder="Игрок"></label>
        <label class="name-row">Поле: <select id="opt-board"><option value="random">Случайное</option><option value="tavern">Таверна «Кайф»</option><option value="castle">Замок Вёрджинвальд</option><option value="dungeon">Подземелье</option></select></label>
      </div>
      <p class="credits">Фанатская версия для игры с друзьями. Карты, персонажи и арты — «Подземелья Чикен Карри».</p>
    </div>
  </section>

  <!-- Hero select -->
  <section id="heroes" class="screen"></section>

  <!-- Deck picker / waiting room -->
  <section id="picker" class="screen">
    <div class="picker-box">
      <h2 id="picker-title">Выберите колоду</h2>
      <div id="picker-list" class="picker-list"></div>
      <div id="picker-online" class="picker-online hidden"></div>
      <div class="picker-actions">
        <button class="btn" data-act="back">← Назад</button>
        <button class="btn primary" id="picker-go" disabled>Начать</button>
      </div>
    </div>
  </section>

  <!-- Deck builder -->
  <section id="builder" class="screen"></section>

  <!-- Rules -->
  <section id="rules" class="screen"></section>

  <!-- Stats -->
  <section id="stats" class="screen"></section>

  <!-- Game -->
  <section id="game" class="screen">
    <div id="stage">
      <div id="board"></div>
      <canvas id="fx-canvas" width="1600" height="900"></canvas>
      <div id="fx-layer"></div>
      <div id="ui-layer"></div>
    </div>
    <div id="preview" class="preview hidden"></div>
      </section>
</div>
<script src="vendor/peerjs.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
